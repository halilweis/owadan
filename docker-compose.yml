services:
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: dev
      APP_SECRET: change-me-local-only
      DATABASE_URL: "postgresql://owadan:owadan_dev@db:5432/owadan?serverVersion=17&charset=utf8"
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: owadan
      POSTGRES_USER: owadan
      POSTGRES_PASSWORD: owadan_dev
    ports:
      - "5432:5432"
    volumes:
      - owadan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owadan -d owadan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  owadan_pgdata:
