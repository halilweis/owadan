security:
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: phoneNumber

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      stateless: true
      provider: app_user_provider
      jwt: ~

  access_control:
    - { path: ^/api/v1/auth, roles: PUBLIC_ACCESS }
    - { path: ^/api/v1/categories, roles: PUBLIC_ACCESS }
    - { path: ^/api/v1/professionals, roles: PUBLIC_ACCESS }
    - { path: ^/(health|ready), roles: PUBLIC_ACCESS }
    - { path: ^/api/v1/me, roles: ROLE_CUSTOMER }
    - { path: ^/api/v1/admin, roles: ROLE_ADMIN }
    - { path: ^/api/v1/pro, roles: ROLE_CUSTOMER }
